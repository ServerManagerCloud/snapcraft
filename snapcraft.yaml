name: server-manager-cloud
version: '0.0.0.1'
summary: A simple "Hello, World!" Go app
description: |
  A simple Go program that prints "Hello, World!" to the console.
base: core20
confinement: strict
grade: devel

apps:
  server-manager-cloud:
    command: server-manager-cloud    
    plugs:
      - home
      - docker
parts:
  server-manager-cloud:
    plugin: go
    source: git@github.com:ServerManagerCloud/snapcraft.git
    source-type: git
    override-build: |
      go build -o server-manager-cloud  # Build binary
      install -Dm755 server-manager-cloud $SNAPCRAFT_PART_INSTALL/server-manager-cloud